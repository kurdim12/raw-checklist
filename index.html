<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6F6B40" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raw Smith Ops" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Raw Smith Ops</title>
    <script>
      // Self-heal kill switch: rescues anyone whose browser is stuck
      // on a stale service worker — either the pre-2026-05-19 SW that
      // crashes on registration with "non-precached-url :: [/index.html]",
      // or a later SW that's silently serving a precached index.html
      // pointing at deleted asset hashes (the JS module 404s and React
      // never mounts, with no workbox error in the console). On any
      // detected failure we unregister every SW, wipe all caches, and
      // reload once so the current SW can install fresh.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var recovering = false;
        function recover(reason) {
          if (recovering) return;
          recovering = true;
          try {
            sessionStorage.setItem('sw-recovered', reason || '1');
          } catch (e) {}
          Promise.all([
            navigator.serviceWorker
              .getRegistrations()
              .then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              })
              .catch(function () {}),
            (typeof caches !== 'undefined'
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve()
            ).catch(function () {}),
          ]).then(function () {
            // Avoid an infinite reload loop if recovery itself fails.
            var marker = 'sw-recovery-reloaded';
            if (sessionStorage.getItem(marker)) return;
            sessionStorage.setItem(marker, '1');
            location.reload();
          });
        }
        // Original workbox crash signature (pre-fix SW still cached).
        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('non-precached-url') !== -1 || msg.indexOf('workbox') !== -1) {
            recover('error');
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('non-precached-url') !== -1) {
            recover('rejection');
          }
        });
        // Stale precache pointing at a Vite asset hash that no longer
        // exists. Resource load failures don't bubble, so this listener
        // runs in capture phase.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || t.tagName !== 'SCRIPT') return;
          var src = t.src || '';
          if (src.indexOf('/assets/') !== -1) {
            recover('asset-404');
          }
        }, true);
        // Last-resort: if React hasn't mounted after the page settled
        // and there is a registered SW, assume something silent went
        // wrong and self-heal. Guarded by the sessionStorage marker so
        // a legitimately slow first paint can't loop.
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (recovering) return;
            var root = document.getElementById('root');
            if (!root || root.children.length > 0) return;
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              if (rs && rs.length > 0) recover('no-mount');
            }).catch(function () {});
          }, 6000);
        });
      })();
    </script>
  </head>
  <body class="bg-olive text-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
